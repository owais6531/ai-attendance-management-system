<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Attendance · {{ app_name }}</title>
    <meta name="description" content="Upload biometric or Excel attendance files, validate every row and store them safely.">
    <link rel="stylesheet" href="/static/css/upload.css">
</head>
<body>
<main class="container">
    <header class="header">
        <h1>{{ app_name }}</h1>
        <p>Upload Excel or CSV attendance exports. Every row is checked; duplicates are skipped automatically.</p>
    </header>

    <section class="card">
        <div class="card-head">
            <h2>1. Choose a file</h2>
            <a class="btn btn-ghost" href="/upload/template" download>Download template</a>
        </div>

        <form id="uploadForm">
            <label class="dropzone" id="dropzone" for="fileInput">
                <input type="file" id="fileInput" name="file" accept=".xlsx,.xls,.csv" required>
                <span class="dz-title" id="dzTitle">Drop a file here or click to browse</span>
                <span class="dz-sub" id="dzSub">.xlsx, .xls or .csv</span>
            </label>

            <div class="options">
                <label>Date format in file
                    <select id="dateOrder" name="date_order">
                        <option value="DMY" selected>Day first (03/04/2025 = 3 April)</option>
                        <option value="MDY">Month first (03/04/2025 = March 4)</option>
                    </select>
                </label>
                {% if auth_required %}
                <label>API key
                    <input type="password" id="apiKey" autocomplete="off" placeholder="Required on this server">
                </label>
                {% endif %}
            </div>

            <div class="actions">
                <button type="button" id="checkBtn" class="btn btn-secondary" disabled>Check only</button>
                <button type="submit" id="uploadBtn" class="btn btn-primary" disabled>Upload &amp; save</button>
            </div>
        </form>
        <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card" id="resultCard" hidden>
        <div class="card-head">
            <h2 id="resultTitle">Result</h2>
            <button type="button" id="resetBtn" class="btn btn-ghost">Upload another file</button>
        </div>
        <p id="resultMessage" class="result-message"></p>
        <div class="stats" id="stats"></div>

        <div id="errorsBlock" hidden>
            <div class="card-head">
                <h3>Rows with errors</h3>
                <button type="button" id="downloadErrors" class="btn btn-ghost">Download errors (CSV)</button>
            </div>
            <p class="hint" id="errorsHint"></p>
            <div class="table-wrap"><table class="table" id="errorsTable"></table></div>
        </div>

        <div id="previewBlock" hidden>
            <h3>Preview of valid rows</h3>
            <div class="table-wrap"><table class="table" id="previewTable"></table></div>
        </div>
    </section>
</main>

<footer class="footer">
    <p>&copy; {{ year }} {{ app_name }} · <a href="/docs">API docs</a></p>
</footer>

<script src="/static/js/upload.js"></script>
</body>
</html>
